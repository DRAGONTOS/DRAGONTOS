<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="discord-oss: Open source version of Discord, with Equicord embedded inside. All rights served by Discord. This is just a entire recreation of the service."><style>
:root { --bg:#0f0b1a; --panel:#18122b; --border:#32285a; --fg:#ece6fa; --dim:#9d90c0; --faint:#6f6491;
        --accent:#c4a1ff; --accent2:#a78bfa; --warm:#f5a3d7; --pill:#231b40; }
@media (prefers-color-scheme: light) {
  :root { --bg:#ffffff; --panel:#f8f5ff; --border:#d9cff2; --fg:#251a3d; --dim:#645a80; --faint:#8a80a6;
          --accent:#7c3aed; --accent2:#6d28d9; --warm:#c026a3; --pill:#efe9fb; }
}
.mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }

    .card { fill:var(--bg); stroke:var(--border); }
    .icon { fill:var(--dim); }
    .name { font-size:18px; font-weight:600; fill:var(--accent2); }
    .desc { font-size:14px; fill:var(--dim); }
    .pill { fill:var(--pill); } .status { font-size:12px; fill:var(--fg); }
    .tag { fill:none; stroke:var(--border); } .tagt { font-size:12px; fill:var(--dim); }
